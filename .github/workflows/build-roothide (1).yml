name: Build Kayoko RootHide

on:
  workflow_dispatch:
  push:
    branches:
      - release

permissions:
  contents: write

env:
  THEOS: ${{ github.workspace }}/theos-roothide
  THEOS_IGNORE_PARALLEL_BUILDING_NOTICE: "yes"
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  build:
    name: Build RootHide package
    runs-on: macos-14

    steps:
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out RootHide Theos
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive

      - name: Install iOS SDK and build dependencies
        run: |
          "${THEOS}/bin/install-sdk" iPhoneOS16.5
          brew install dpkg ldid xz fakeroot
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          echo "${THEOS}/bin" >> "$GITHUB_PATH"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build RootHide package
        run: |
          chmod +x build.sh
          ./build.sh roothide

      - name: Audit RootHide package lifecycle safety
        run: |
          set -euo pipefail
          package="$(find packages -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$package"
          test "$(dpkg-deb -f "$package" Architecture)" = "iphoneos-arm64e"

          contents="$(mktemp)"
          dpkg-deb --fsys-tarfile "$package" | tar --numeric-owner -tvf - > "$contents"

          if grep -Eq ' Library/MobileSubstrate(/DynamicLibraries)?/?$' "$contents"; then
            echo "error: package claims ElleKit's shared compatibility path" >&2
            exit 1
          fi
          if grep -Eq '(^|[[:space:]])501/20([[:space:]]|$)|(^|[[:space:]])501:20([[:space:]]|$)' "$contents"; then
            echo "error: package data is owned by mobile instead of root" >&2
            exit 1
          fi
          grep -Eq ' usr/lib/TweakInject/KayokoCore\.dylib$' "$contents"
          grep -Eq ' usr/lib/TweakInject/KayokoHelper\.dylib$' "$contents"

          scripts="$(mktemp -d)"
          dpkg-deb -e "$package" "$scripts"
          for script in postinst postrm; do
            test -x "$scripts/$script"
            head -n 1 "$scripts/$script" | grep -Fx '#!/bin/sh'
            if LC_ALL=C grep -q $'\r' "$scripts/$script"; then
              echo "error: $script contains CRLF line endings" >&2
              exit 1
            fi
          done

      - name: Upload RootHide package
        uses: actions/upload-artifact@v4
        with:
          name: kayoko-roothide
          path: packages/*.deb
          if-no-files-found: error

  release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/release'

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read package version
        run: |
          VERSION=$(awk -F ': ' '/^Version:/{print $2; exit}' control)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: kayoko-roothide
          path: release-packages

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-roothide
          name: Kayoko RootHide v${{ env.VERSION }}
          draft: true
          files: release-packages/*.deb
